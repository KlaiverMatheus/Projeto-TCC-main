# Configuração do banco de dados
spring.datasource.url=jdbc:mariadb://localhost:3306/projetoTcc
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuração JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.MariaDBLegacyDialect

# 3. Formata o SQL no console para ficar legível (com quebras de linha)
spring.jpa.properties.hibernate.format_sql=true

# Porta do servidor
server.port=8080

# Configuração de logs
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

spring.jpa.open-in-view=false